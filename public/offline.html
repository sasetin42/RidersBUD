<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Offline — RidersBUD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0A0A0C;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #141419;
            border: 1px solid #26262E;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .logo-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #1E1E26;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(254, 120, 3, 0.2);
            border: 1px solid rgba(254, 120, 3, 0.3);
        }
        .logo-wrap img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 12px;
        }
        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #A0A0AB;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            background: #FE7803;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
            background: #E06800;
        }
        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: #63636E;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <img src="/icons/icon-192.png" alt="RidersBUD Logo" onerror="this.src='/favicon.png'" />
        </div>
        <div class="badge">No Internet Connection</div>
        <h1>You're Currently Offline</h1>
        <p>
            RidersBUD requires an active internet connection to load fresh booking details, live map tracking, and secure transactions.
        </p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
        <div class="hint">Check your Wi-Fi or cellular data settings.</div>
    </div>
</body>
</html>
