// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Override Java + Kotlin compatibility for all subprojects to match the installed JDK 17.
// Capacitor Android 8.x declares sourceCompatibility/jvmTarget 21 which requires JDK 21+.
// This block forces all modules to compile at Java/Kotlin 17 level.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            // Override Kotlin JVM target via kotlinOptions if the extension exists
            try {
                project.android.kotlinOptions {
                    jvmTarget = '17'
                }
            } catch (ignored) {}
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
